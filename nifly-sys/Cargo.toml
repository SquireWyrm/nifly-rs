[package]
name = "nifly-sys"
version = "0.1.0"
edition = "2024"
authors = ["SquireWyrm"]
rust-version = "1.88"
description = "Raw cxx bindings to the nifly C++ NIF library, built from source"
license = "GPL-3.0-or-later"
repository = "https://github.com/SquireWyrm/nifly-rs"
readme = "README.md"
keywords = ["nif", "bethesda", "gamebryo", "ffi"]
categories = ["external-ffi-bindings"]
# Two copies of nifly's C++ in one build would clash at link time.
links = "nifly"
# The vendored nifly is a git submodule, which packaging leaves out unless listed here.
include = [
    "/build.rs",
    "/README.md",
    "/src/**",
    "/include/**",
    "/vendor/nifly/src/**",
    "/vendor/nifly/include/**",
    "/vendor/nifly/external/**",
    "/vendor/nifly/LICENSE",
    "/vendor/nifly/README.md",
]

[dependencies]
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"
cc = "1.2"
